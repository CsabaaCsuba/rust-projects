[package]
name = "opengl_api" # the name of the package
version = "0.1.0"    # the current version, obeying semver
authors = ["Csabi"]
edition = "2021"

[dependencies]
bindgen = "0.71.1"  # Used to automatically generate bindings to C libraries
cc = "1.0"
libc = "0.2"      # Provides the necessary C types for FFI

[build-dependencies]
cc = "1.0"         # Used for compiling C code during the build process (if necessary)
bindgen = "0.71.1"  # Used to automatically generate bindings to C libraries