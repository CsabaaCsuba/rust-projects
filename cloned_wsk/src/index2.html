<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatting</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;

        }
        .score-board {
            background: rgba(255, 255, 255, 0.9); /* Adjust transparency if needed */
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
        }
        .score {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
        }
        #error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="main">
        <form action="" onsubmit="login_user" id ="loginform">
            <p id="error"></p>
            <input type="text" id="username">
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        const ws = new WebSocket('ws://127.0.0.1:8080');
        const usernameField = document.getElementById("username")
        const errorField = document.getElementById("error")

        function login_user(event){
            event.preventDefault();
            (username != "") ? ws.send(JSON.stringify({"username":usernameField.value})) : errorField.textContent = "please provide a username!"
            
        }


        ws.onopen = function() {
            console.log('Connected to WebSocket server');
        };

        ws.onmessage = function(event) {
            console.log('Received update:', event.data);
            document.getElementById('score').innerText = event.data;
            send_msg("header changed to: "+event.data);
        };

        ws.onclose = function() {
            console.log('Disconnected from WebSocket server');
            document.getElementById('score').innerText = 'Disconnected';
        };

        

        function send_msg(msg){
            ws.send(msg);
        }
        
    </script>
</body>
</html>
